version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line; move majors deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Enable when /backend exists (plan step 4):
  # - package-ecosystem: pip
  #   directory: /backend
  #   schedule:
  #     interval: weekly
