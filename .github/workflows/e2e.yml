name: E2E

# Browser smoke tests: the real website, API and Postgres, with an invented data vendor (no key, no
# network). It is a separate workflow so a slow browser run never delays the unit-test checks.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: virello
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: virello_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virello -d virello_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIRELLO_DATABASE_URL: postgresql+asyncpg://virello:ci-only-not-a-secret@localhost:5432/virello_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare the API and its database
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: Build the website
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the smoke tests
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
