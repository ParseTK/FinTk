name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The generated API client must match the committed contract (backend/openapi.json).
      - run: npm run gen:api
      - name: Fail if the generated client is stale
        run: git diff --exit-code -- src/features/market-data/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fail on high/critical advisories in production dependencies only.
      - run: npm audit --omit=dev --audit-level=high

  backend:
    # Always runs (it is quick) so the check is reported on every PR and can be required.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # A real Postgres, the same major version as production. The database tests run against it
    # and fail (never skip) when it is missing. These credentials belong to a throwaway container
    # that only exists for this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: virello
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: virello_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virello -d virello_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIRELLO_TEST_DATABASE_URL: postgresql+asyncpg://virello:ci-only-not-a-secret@localhost:5432/virello_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The Python version comes from backend/.python-version, and the lockfile must be up to date.
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest
      # Fail on any known vulnerability in the production dependencies.
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
