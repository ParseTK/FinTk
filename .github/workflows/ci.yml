name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The generated API client must match the committed contract (backend/openapi.json).
      - run: npm run gen:api
      - name: Fail if the generated client is stale
        run: git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Runs the tests and fails if coverage drops below the floor in vitest.config.mts.
      - run: npm run test:coverage
      - run: npm run build
      # The production bundle must stay under its size budget (scripts/check-budgets.mjs).
      - run: npm run budget
      # Fail on high/critical advisories in production dependencies only.
      - run: npm audit --omit=dev --audit-level=high
      # Every production dependency must carry a permissive licence (the allow-list is in package.json).
      - run: npm run license:check

  backend:
    # Always runs (it is quick) so the check is reported on every PR and can be required.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # A real Postgres, the same major version as production. The database tests run against it
    # and fail (never skip) when it is missing. These credentials belong to a throwaway container
    # that only exists for this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: virello
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: virello_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virello -d virello_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIRELLO_TEST_DATABASE_URL: postgresql+asyncpg://virello:ci-only-not-a-secret@localhost:5432/virello_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The Python version comes from backend/.python-version, and the lockfile must be up to date.
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      # The layering rules in pyproject.toml ([tool.importlinter]): a layer crossing fails the build.
      - run: uv run lint-imports
      # Runs the tests and fails if coverage drops below fail_under in pyproject.toml.
      - run: uv run pytest --cov
      # Every production dependency must carry a permissive licence.
      - name: Check dependency licences
        run: >-
          uv run --no-dev --with pip-licenses==5.5.5 pip-licenses --format=plain
          --allow-only="Apache Software License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;BSD License;BSD-2-Clause;BSD-3-Clause;MIT;MIT AND PSF-2.0;MIT License;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License"
      # Fail on any known vulnerability in the production dependencies.
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Builds the frontend container exactly as the release does (without pushing), proves it starts and
    # answers its health check, then scans it. Before this, the image was only built after a merge.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          push: false
          tags: virello-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait for it to report healthy
        run: |
          docker run -d --name web -p 3000:3000 virello-web:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' web)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          [ "$status" = "healthy" ]
          curl --fail --silent http://127.0.0.1:3000/healthz
          test "$(docker exec web id -un)" = "app"
      # Fixed vulnerabilities rated high or critical in the image fail the build. Unfixed ones do not:
      # there is nothing to upgrade to.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: virello-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Dockerfile mistakes (running as root, no health check and so on).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: frontend
          severity: HIGH,CRITICAL
          exit-code: "1"
      # A bill of materials for the image, kept with the run.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: virello-web:ci
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-image-sbom
          path: sbom.cdx.json
          retention-days: 30

  backend-image:
    # The API container, built and scanned like the frontend one. This is also what would have caught
    # httpx being missing from the production dependencies: the image crashed on start.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: virello-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Start the container and wait for it to report healthy
        run: |
          docker run -d --name api -p 8000:8000 virello-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          [ "$status" = "healthy" ]
          curl --fail --silent http://127.0.0.1:8000/healthz
          test "$(docker exec api id -un)" = "app"
          # The server must not announce what it is.
          ! curl --silent --head http://127.0.0.1:8000/healthz | grep -i '^server:'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: virello-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: "1"
