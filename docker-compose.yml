# Local development database.
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD
#   docker compose up -d        # start Postgres (waits until healthy with --wait)
#   docker compose down         # stop it; the data survives in the named volume
#   docker compose down -v      # stop it and delete the data
#
# Same Postgres major version as CI and production, so behaviour matches.

name: virello

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: virello_app
      # No default on purpose: a password committed to the repo is a password everyone knows.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: virello
    ports:
      # Localhost only: the database is never exposed to the network. 5433 by default so it does
      # not collide with a Postgres already installed on the host.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on the first start of an empty volume: creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virello_app -d virello"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # A laptop-sized cap so a runaway query cannot take the whole machine.
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
